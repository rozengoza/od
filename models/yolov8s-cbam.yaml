# YOLOv8 + CBAM: identical to Ultralytics' stock yolov8.yaml backbone/neck,
# with one CBAM attention layer inserted immediately before each of the
# three detection heads (P3/8-small, P4/16-medium, P5/32-large). CBAM
# re-weights channel/spatial features so the model attends to small,
# cluttered objects (heads, helmets) instead of dominant background before
# the final prediction convolutions. Requires models/register_modules.py
# to be imported first so the "CBAM" module name resolves.
#
# Filename must contain "yolov8s" so Ultralytics infers scale "s" from it;
# swap to yolov8n/m/l/x-cbam.yaml (rename + this same content) to change scale.

nc: 3  # helmet, head, person
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]  # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]  # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]  # 15 (P3/8-small, pre-attention)
  - [-1, 1, CBAM, []]  # 16 (P3/8-small, post-attention -> feeds Detect)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]  # 19 (P4/16-medium, pre-attention)
  - [-1, 1, CBAM, []]  # 20 (P4/16-medium, post-attention -> feeds Detect)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]  # 23 (P5/32-large, pre-attention)
  - [-1, 1, CBAM, []]  # 24 (P5/32-large, post-attention -> feeds Detect)

  - [[16, 20, 24], 1, Detect, [nc]]  # Detect(P3, P4, P5)
